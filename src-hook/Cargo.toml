[package]
name = "hook"
# Hand-bumped whenever the shipped hook's behavior changes (src-hook/ or the
# game-reader/ code it compiles in). The app treats a mapped hook reporting a
# different version as OutOfDate even on a matching wire, and this is the
# version stamped into the DLL's resource block — so an unbumped change ships
# a hook indistinguishable from the previous one.
version = "0.2.4"
edition = "2021"

[lib]
crate-type = ["cdylib"]

[features]
console = []
# Verbose per-hit dump of the DamageInstance struct (a2) to the fern log, used to
# re-derive shifted field offsets (action_id, damage_cap, ...) after a game patch.
dmgdiag = []
# Per-hit capture for the UNFINISHED cap / damage-head models: the DamageEvent's
# `source_snapshot` and `record_snapshot` fields (NOT `source_statuses` — that
# ships unconditionally, see `hooks/damage.rs::SourceState::capture`, because
# `src/pages/logs/view/events/capFactors/conditions.ts` reads it for every hit).
# Unlike every other diagnostic here this rides the EVENT STREAM, not the fern
# log, so without a gate it lands in every user's logs.db forever — and nothing
# reads either field yet. It also costs a raw window copy per hit, plus a
# holder->vtable->virtual chain for the record.
# `instance_snapshot` is deliberately NOT here: `parser::v1::damage_facts` reads
# it for the Analysis view's crit / back-attack / weak-point / Break facts, so it
# has graduated and ships. When one of these two graduates the same way, move
# it out of the gate and delete its line from the doc table.
capresearch = []
# Runtime-address logger for re-deriving broken FUNCTION hooks after a game patch.
# Logs the module base + the return address (caller RVA) and key pointers from the
# hooks that still work, so triggering an in-game event (death, SBA, player load)
# reveals the RVA of the nearby broken target. See hooks/diag.rs.
hookdiag = ["dep:backtrace"]
# DEV ONLY: unlock the game's built-in Full Assist AI in Infinity quests
# (hooks/assist.rs). Changes game behavior, so it is never built for release.
fullassist = ["dep:serde_json"]
# DEV ONLY: the hook tears down its detours and shuts down its runtime on a
# control-channel `Eject` request, so the app can FreeLibrary + re-inject a
# rebuilt DLL without a game restart. Never built for release.
eject = []
# Proton/Wine support, and NOTHING else: the dinput8 proxy export (proxy.rs)
# plus the localhost-TCP transport the event/toolbox/control channels fall
# back to under Wine. Off for the Windows DLL on purpose — see proxy.rs and
# transport.rs. That build is injected into the game process, and the three
# things this feature adds (a `DirectInput8Create` export, a `LoadLibraryW`
# on a hardcoded system32 path, and a listening socket) are exactly the
# triad AV heuristics read as a DLL-hijack backdoor. They are dead weight on
# Windows — `is_wine()` is false there, so none of it ever ran.
proton = []

[package.metadata.winres]
OriginalFilename = "hook.dll"
ProductName = "GBFR Logs"
FileDescription = "GBFR Logs damage meter hook"
InternalName = "hook.dll"
CompanyName = "Scott Donnelly"
Comments = "Source: https://github.com/villith/relink-logs"

[dependencies]
anyhow = "1.0"
backtrace = { version = "0.3", optional = true }
serde_json = { version = "1.0", optional = true }
ctor = "0.2.6"
dirs = "5.0"
fern = { version = "0.6" }
interprocess = { version = "^2.0", features = ["tokio"] }
log = "0.4"
pelite = "0.10.0"
retour = { version = "0.3.1", features = ["static-detour"] }
thiserror = "1.0"
tokio = { version = "1.0", features = ["full"] }
windows = { version = "0.52.0", features = [
  "Win32_Foundation",
  "Win32_System_Diagnostics_Debug",
  "Win32_System_Console",
  "Win32_System_Memory",
  "Win32_System_LibraryLoader",
] }
futures = "0.3"
protocol = { path = "../protocol" }
game-reader = { path = "../game-reader" }
tokio-util = { version = "0.7.11", features = ["codec"] }


[dev-dependencies]
# So `hooks/assist.rs` still COMPILES (and its tests run) under a plain `cargo test`,
# which does not enable the `fullassist` feature. Without this the one hook that
# changes game behaviour is the only one whose logic is never type-checked or tested
# by the default suite. The hook is still only INSTALLED behind the feature.
serde_json = "1.0"

[build-dependencies]
winres = "0.1"
